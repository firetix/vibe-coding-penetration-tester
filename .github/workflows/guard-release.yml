name: Draft authorization runner release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New prerelease tag, for example v2.0.0a2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from vibe_pentest import __version__
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          assert __version__ == version
          PY
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check vibe_pentest guard_tests examples/fastapi examples/supabase scripts/refresh_landing_demo.py
      - run: uv run pytest guard_tests -q -o addopts='' -o log_cli=false
      - run: uv build
      - name: Install wheel and verify demo
        run: |
          uv venv /tmp/vpt-release
          uv pip install --python /tmp/vpt-release/bin/python dist/*.whl
          cd /tmp
          /tmp/vpt-release/bin/vpt demo
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$RELEASE_TAG" dist/* --draft --prerelease --target "$GITHUB_SHA" --title "VibePenTester $RELEASE_TAG" --notes-file docs/release-notes.md
